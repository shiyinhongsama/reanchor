services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - TP_ENV=dev
      - TP_LIVE_ENABLED=false        # 实盘总开关，默认关
      - TP_GATE_SANDBOX=false
    volumes:
      - ./backend:/app               # 开发期热挂载
      - market-data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /web
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  market-data:
